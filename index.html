<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play-Along</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/design/matthewannable.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <span class="eyebrow">Play-Along</span>
      </header>

      <div id="drop-zone" class="drop-zone">
        <p>Drag a <code>.gp</code> file here, or click to choose one</p>
        <input id="file-input" type="file" accept=".gp,.gp3,.gp4,.gp5,.gpx" hidden />
      </div>

      <section id="recent-songs" class="recent-songs" hidden>
        <h2>Recent</h2>
        <ul id="recent-songs-list" class="recent-songs-list"></ul>
      </section>

      <div id="player" class="player" hidden>
        <div class="song-meta">
          <h1 id="song-title"></h1>
          <p id="song-artist" class="song-artist"></p>
        </div>

        <div class="transport card">
          <div class="transport-row">
            <button id="play-button" class="btn-amber" type="button">Play</button>

            <div class="scrubber-row">
              <span id="time-current" class="time">0:00</span>
              <input id="scrubber" class="scrubber" type="range" min="0" max="1000" value="0" />
              <span id="time-total" class="time">0:00</span>
            </div>

            <div class="bar-counter">Bar <span id="bar-current">1</span> / <span id="bar-total">1</span></div>
          </div>

          <div class="control-row">
            <label class="control">
              <span class="control-label">Speed</span>
              <input id="speed-slider" type="range" min="50" max="120" step="5" value="100" />
              <span id="speed-value" class="control-value">100%</span>
            </label>

            <label class="control control-checkbox">
              <input id="loop-toggle" type="checkbox" />
              <span>Loop bars</span>
            </label>
            <input id="loop-start" class="bar-input" type="number" min="1" value="1" aria-label="Loop start bar" />
            <span class="control-sep">to</span>
            <input id="loop-end" class="bar-input" type="number" min="1" value="1" aria-label="Loop end bar" />

            <label class="control control-checkbox">
              <input id="tab-only-toggle" type="checkbox" />
              <span>Tab only</span>
            </label>

            <label class="control control-checkbox" id="guitar-toggle-row" hidden>
              <input id="guitar-toggle" type="checkbox" checked />
              <span>Guitar</span>
            </label>

            <select id="track-select" aria-label="Track"></select>

            <button id="view-toggle-button" class="btn-ghost" type="button">Highway view</button>
            <button id="presentation-button" class="btn-ghost" type="button">Presentation</button>
          </div>
        </div>

        <div id="alphatab" class="alphatab-surface"></div>

        <div id="highway" class="highway-surface" hidden>
          <div class="highway-header">
            <div>
              <span class="highway-title" id="highway-song-title"></span>
              <span class="highway-artist" id="highway-song-artist"></span>
            </div>
            <div class="highway-meta">
              <span id="highway-bar-info">Bar 1 / 1</span>
              <span id="highway-tempo"></span>
              <span id="highway-track-name"></span>
            </div>
          </div>
          <canvas id="highway-canvas"></canvas>
        </div>
      </div>

      <p id="status" class="status" role="status"></p>
    </main>

    <div id="second-file-modal" class="modal-backdrop" hidden>
      <div class="modal-card">
        <p id="second-file-modal-text"></p>
        <div class="modal-actions">
          <button id="second-file-cancel" class="btn-text" type="button">Cancel</button>
          <button id="second-file-replace" class="btn-green-outline" type="button">Replace recording</button>
          <button id="second-file-no-guitar" class="btn-amber" type="button">Use as no-guitar version</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
